data:
  train_path: "data/train"
  test_normal_path: "data/test/normal"
  test_abnormal_path: "data/test/abnormal"
  image_size: 224
model:
  name: "patchcore"
  backbone: "wide_resnet50_2"
  layers: ["layer2", "layer3"]
  coreset_sampling_ratio: 0.1
  model_filename: "patchcore_wideresnet50_2.pth"
training:
  batch_size: 8
  device: "cpu"
  num_workers: 2
evaluation:
  batch_size: 4
output_path: "outputs/patchcore_wideresnet50_2"
experiment:
  run_name: "patchcore_wideresnet50_2"
  train: true
  test: true
  visualize: true
  detect_humans: true
  vis_topk: 10
# Human detection settings for thermal images
human_detection:
  enabled: true
  min_area: 90
  max_area: 9000
  sensitivity: 1.85
  use_yolo: true  # Enable YOLO detection
  yolo_confidence: 0.5
  yolo_size: "small"  # Options: nano, small, medium, large
wandb:
  use_wandb: true
  project: "drone-anomaly-detection"
  entity: null
  tags: ["patchcore", "wide_resnet50_2"] 