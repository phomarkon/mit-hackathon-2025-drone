# Data settings
data:
  train_path: "data/train"
  test_normal_path: "data/test/normal"
  test_abnormal_path: "data/test/abnormal"
  image_size: 224 # Standard size for many pre-trained models

# Model settings (PatchCore)
model:
  name: "patchcore"
  backbone: "resnet18" # Start with a simpler backbone
  layers: ["layer2", "layer3"] # Intermediate layers for features
  coreset_sampling_ratio: 0.1  # Use 10% of patches for memory bank
  model_filename: "patchcore_resnet18.pth" # Model-specific filename

# Training settings
training:
  batch_size: 8  # Reduced batch size to save memory
  device: "cpu"  # Use "cuda" if GPU is available, otherwise "cpu"
  num_workers: 2  # Reduced number of workers

# Evaluation settings
evaluation:
  batch_size: 4  # Reduced batch size for evaluation

# Output settings
output_path: "outputs/patchcore_resnet18" # Model-specific output path
# model_filename: "patchcore_model.pth" # Now defined within model section

# Experiment settings
experiment:
  run_name: "patchcore_resnet18_baseline"
  train: true      # Whether to run training
  test: true       # Whether to run testing
  visualize: true  # Whether to run visualization
  vis_topk: 10     # Number of top anomalies to visualize

# Weights & Biases logging
wandb:
  use_wandb: true
  project: "drone-anomaly-detection"
  entity: null  # Set to your wandb username or team name, or leave as null
  tags: ["patchcore", "resnet18", "baseline"] 