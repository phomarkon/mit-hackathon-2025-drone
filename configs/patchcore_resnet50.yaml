data:
  train_path: "data/train"
  test_normal_path: "data/test/normal"
  test_abnormal_path: "data/test/abnormal"
  image_size: 224
model:
  name: "patchcore"
  backbone: "resnet50"
  layers: ["layer2", "layer3"]
  coreset_sampling_ratio: 0.1
  model_filename: "patchcore_resnet50.pth"
training:
  batch_size: 8
  device: "cpu"
  num_workers: 2
evaluation:
  batch_size: 4
output_path: "outputs/patchcore_resnet50"
experiment:
  run_name: "patchcore_resnet50"
  train: true
  test: true
  visualize: true
  detect_humans: true
  vis_topk: 10
# Human detection settings for thermal images
human_detection:
  enabled: true
  min_area: 80
  max_area: 8000
  sensitivity: 1.9
  use_yolo: true  # Enable YOLO detection
  yolo_confidence: 0.45
  yolo_size: "nano"  # Options: nano, small, medium, large
wandb:
  use_wandb: true
  project: "drone-anomaly-detection"
  entity: null
  tags: ["patchcore", "resnet50"] 